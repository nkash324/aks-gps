# Settings for the GPS/map stack (kart_gps/, kart_gpu/). Put machine-specific changes in
# gps.local.yaml (same keys; git-ignored).

track_world: tracks/purdue_rtk/track_world.xml   # edges are read from its line0_/line1_ pieces
physics: 2d                # 2d = kart_gps/kart.py (training, benchmarks) | mujoco = kart_gps/mj_kart.py

mujoco:                    # only used with physics: mujoco (aks_kart.xml on the track world)
  friction_scale: 1.0      # tyre contact friction = mu x this (front also x front_grip)
  front_friction_scale: 1.3 # tuned: skidpad 1.11 g vs 1.15 g in 2D (a rigid chassis has no steering jacking, so it understeers)
  solref: [0.02, 1.0]      # tyre contact stiffness (time constant s, damping ratio); 0.004 (aks_kart.xml) bounces
  cone: elliptic           # pyramidal | elliptic friction cone (elliptic = tuned)
  impratio: 1.0
  solimp: [0.5, 0.95, 0.01] # contact firms up over 1 cm of tyre squash; the default (0.9, 1 mm) makes the tyres chatter
  substeps: 4              # MuJoCo steps per 2 ms physics step (1 = tyre chatter, an off-track lap)
  condim: 6                # tyre contact: 3 = sliding friction, 6 = + torsional and rolling
  imu_filter_hz: 30.0      # accelerometer low-pass (BNO055 filters internally)
  lines: false             # draw the track edges (the viewer turns this on)

kart:
  # --- mass and layout (AKS BoM; 125 kg = the AKS rule minimum, ~10 kg ballast) ---
  mass: 125.0              # kg, with everything on
  front_weight: 0.45       # share of the weight on the front axle
  cg_height: 0.20          # m
  yaw_inertia: 45.0        # kg m^2
  wheelbase: 1.04          # m
  track_front: 1.00        # m, tyre centre to tyre centre
  track_rear: 1.15
  kingpin_half: 0.50       # m, kingpin to kart centre (Ackermann)
  tyre_front: {diameter: 0.254, width: 0.115}
  tyre_rear: {diameter: 0.279, width: 0.180}
  length: 1.80             # m, bumper to bumper (drawing only)

  # --- tyres (simplified Pacejka, combined slip) ---
  mu: 1.0                  # peak grip; rear-only braking then tops out near 4.5 m/s^2
  front_grip: 1.0          # front/rear grip ratio (<1 = more understeer; stands in for chassis flex)
  slip_ratio_peak: 0.20    # longitudinal slip at peak force (soft kart tyres on 5" rims)
  slip_angle_peak_deg: 7.0 # slip angle at peak lateral force
  shape: 1.4               # Pacejka C: sliding grip ~85% of peak
  load_sensitivity: 0.10   # grip loss per unit of extra load (fraction of static load)
  rolling_resistance: 0.015
  drag_area: 0.50          # Cd * frontal area, m^2
  axle_inertia: 0.30       # kg m^2, rear wheels + axle + motor through the gearing
  tip_lateral_g: 2.6       # inside wheels lift above this (counted as a rollover)
  rear_roll_share: 0.70    # share of the cornering weight transfer taken by the rear axle
  steer_jacking: 300.0     # N per rad of steering moved off the inside rear (caster + frame flex)

  # --- drive (VESC + motor) ---
  drive_force: 500.0       # N at the tyres, max
  top_speed: 12.0          # m/s, motor rpm limit
  top_speed_taper: 1.5     # force fades to zero over the last 1.5 m/s
  motor_lag: 0.02          # s, torque response
  # --- regen (battery charge current limit: ~4 A/cell x 15p ~ 60 A ~ 3.5 kW at the pack) ---
  regen_force: 500.0       # N max at the tyres
  regen_power: 4100.0      # W at the wheel
  # --- hydraulic rear brake (linear actuator on the master cylinder) ---
  brake_force: 1500.0      # N at the tyres with the actuator fully in (enough to lock the rears)
  brake_apply_time: 0.6    # s from the bite point to full force (10 mm/s actuator)
  brake_hold_at_bite: true # keep the pads at the bite point while driving
  brake_dead_time: 0.4     # s of travel before the pads touch, only if not held at the bite point

  # --- steering (motor on the column) ---
  max_steer_deg: 25.0      # at the wheels
  steer_rate_deg: 80.0     # deg/s
  steer_delay: 0.04        # s

control:
  rate_hz: 20              # drivers send (target speed m/s, curvature 1/m) at this rate
  physics_hz: 500
  lowlevel_hz: 100         # speed/brake/steering loop (VESC + brake + steering controllers)
  speed_kp: 3.0            # (m/s^2) per (m/s) of speed error
  speed_ki: 0.5
  max_brake_decel: 6.0     # m/s^2 the speed controller may ask for
  abs_slip: 0.12           # anti-lock: ease the mechanical brake above this rear slip
  grip_accel: 8.0          # m/s^2 total the throttle may use with cornering (friction circle)

randomize:                 # per run, uniform +-fraction around the values above
  enabled: true
  mu: 0.15
  front_grip: 0.10
  steer_jacking: 0.25
  mass: 0.05
  drive_force: 0.10
  regen_power: 0.15
  brake_force: 0.15
  brake_apply_time: 0.15
  steer_rate_deg: 0.15
  steer_delay: 0.25

sensors:
  level: realistic          # perfect | realistic | harsh (benchmarks run all three)
  levels:
    perfect: {scale: 0.0, latency: false}
    realistic: {scale: 1.0, latency: true}
    harsh: {scale: 2.0, latency: true}
  # Values below are the "realistic" level; "scale" multiplies every noise, bias,
  # offset and event rate (0 = exact readings).
  gnss:                     # u-blox ZED-F9P RTK, antenna above the rear axle
    rate_hz: 20
    latency: 0.05           # s from measurement to the message arriving
    pos_noise: 0.015        # m, 1 sigma per axis, white
    pos_wander: 0.01        # m, slowly varying error (multipath), ~10 s correlation
    vel_noise: 0.05         # m/s per axis
    float_rate: 0.5         # RTK float episodes per minute (fix drops to float)
    float_error: 0.30       # m, offset while in float
    float_duration: [1.0, 5.0]
    dropout_rate: 0.3       # no messages at all, per minute
    dropout_duration: [0.3, 1.5]
  map_offset:               # map vs kart GPS mismatch, after calibrating the map at the track (measure a few known points)
    shift: 0.05             # m, uniform +-, each axis, per run (calibrated). Stress test: --map-shift 0.3
    rotate_deg: 0.0         # deg, uniform +-
  imu:                      # BNO055 near the centre of mass, 100 Hz
    rate_hz: 100
    gyro_noise: 0.002       # rad/s, 1 sigma per sample
    gyro_bias: 0.005        # rad/s, per run
    accel_noise: 0.15       # m/s^2 (includes motor/road vibration)
    accel_bias: 0.05        # m/s^2, per run
  wheel:                    # rear axle encoder, 100 Hz
    rate_hz: 100
    noise: 0.02             # m/s
    scale_error: 0.01       # tyre radius not exactly known, per run

planner:
  buffer: 0.30              # m kept between the tyres and the surveyed edges (optimised line)
  lat_accel: 6.0            # m/s^2 cornering the speed plan allows (~0.6 g; the kart tops out ~0.85 g at mu 1)
  brake_decel: 4.0          # m/s^2 the speed plan brakes at (rear-only braking tops out ~4.5-5)
  top_speed: 11.5           # m/s, a little under the motor limit so the speed loop can hold it

drivers:
  pure_pursuit:             # look-ahead = clip(gain * speed + base, min, max) metres
    gain: 0.35              # tuned once at realistic noise (scripts/gps/benchmark.py --tune)
    base: 1.0
    min: 2.0
    max: 6.0
    speed_preview: 0.5      # s: aim for the planned speed this far ahead (actuator lag)
    float_slowdown: 0.7     # speed factor while RTK is in float
    lost_slowdown: 0.4      # speed factor when there has been no GNSS for 0.5 s

residual:                   # learned corrections on top of driver B (kart_gps/rl_env.py, scripts/gps/train_residual.py)
  max_dv: 1.0               # m/s: action +-1 -> this much added to B's target speed
  max_dk: 0.02              # 1/m: action +-1 -> this much added to B's curvature
  preview: [2, 4, 6, 9, 12, 16, 20, 25, 30, 40]   # m ahead on the line: curvature + planned speed
  room_preview: [0, 5, 10, 20, 30]                 # m ahead: line's room to the left / right edge
  mix:                      # share of training laps once the curriculum is done
    harsh: 0.1              # harsh sensor level (rest realistic)
    stress: 0.0             # --map-shift 0.3 stress test: off, Skylark corrections keep the map aligned
  reward:
    progress: 1.0           # per metre along the lap
    time: 0.2               # per step (1/20 s): makes a lap 1 s faster worth +4
    lap: 10.0               # finishing the lap
    fail: 20.0              # off track, rollover, stuck or timeout
    edge_margin: 0.30       # m: tyres closer than this to an edge are penalised
    edge: 0.5               # per step at the edge, quadratic in how far inside the margin
    action: 0.02            # per step, x |action|^2
    jerk: 0.05              # per step, x |action change|^2
  ppo:
    gamma: 0.995
    gae_lambda: 0.95
    learning_rate: 0.0003   # decays linearly to 0 over --steps
    n_steps: 1024           # per env per update
    batch_size: 1024
    n_epochs: 10
    clip_range: 0.2
    ent_coef: 0.001
    vf_coef: 0.5
    max_grad_norm: 0.5
    log_std_init: -1.0      # exploration noise ~0.37 of the action range at the start
    net: [128, 128]
